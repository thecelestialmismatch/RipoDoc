name: Verify browser-local zero egress

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'tools/**'
      - 'web/frontend/**'
      - '.github/workflows/zero-egress-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-composer-zero-egress:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/frontend/package-lock.json

      - name: Install Chromium for local browser verification
        run: |
          sudo apt-get update
          sudo apt-get install --yes chromium

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix web/frontend ci

      - name: Run CLI contract and fail-closed simulation tests
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run test:zero-egress-cli

      - name: Run production-mode zero-egress baseline
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run audit:zero-egress:ci

      - name: Prove production-mode fail-closed interception matrix
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          mkdir -p build/zero-egress-audit/simulations
          for kind in external-cdn external-api same-origin-api; do
            set +e
            npm run audit:zero-egress -- --mode production --simulate "$kind" --out "build/zero-egress-audit/simulations/${kind}.json"
            status=$?
            set -e
            test "$status" -eq 1
            grep -q '"outcome": "expected-failure"' "build/zero-egress-audit/simulations/${kind}.json"
            grep -q '"locallyAborted": true' "build/zero-egress-audit/simulations/${kind}.json"
            grep -q '"observedMatches": 1' "build/zero-egress-audit/simulations/${kind}.json"
            grep -q '"simulationValidated": true' "build/zero-egress-audit/simulations/${kind}.json"
          done

      - name: Upload zero-egress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-composer-zero-egress
          path: build/zero-egress-audit/**/*.json
          if-no-files-found: warn
