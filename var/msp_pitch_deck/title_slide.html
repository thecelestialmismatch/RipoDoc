<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+Pro:wght@300&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            box-sizing: border-box;
            background: #FFFFFF;
            font-family: 'Source+Sans+Pro', sans-serif;
            color: #3E4A61;
            position: relative;
            overflow: hidden;
            /* shift container up 1px so its bottom sits at 719px (top: -1 + min-height:720 = 719) */
            margin-top: -1px;
        }
        .header-serif {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #1A2639;
            font-size: 84px;
            line-height: 1.1;
            margin-top: 120px;
            margin-left: 80px;
            z-index: 2;
            position: relative;
        }
        .subtitle-sans {
            font-weight: 300;
            font-size: 32px;
            color: #3E4A61;
            margin-top: 40px;
            margin-left: 80px;
            max-width: 700px;
            line-height: 1.4;
            z-index: 2;
            position: relative;
        }
        .accent-block {
            position: absolute;
            bottom: -100px;
            right: -50px;
            width: 600px;
            height: 500px;
            background: #C24D2C;
            transform: rotate(-5deg);
            z-index: 1;
        }
        .decorative-line {
            position: absolute;
            top: 320px;
            left: 80px;
            width: 400px;
            border-top: 2px dashed #C24D2C;
            z-index: 2;
        }
        .logo-placeholder {
            position: absolute;
            top: 40px;
            left: 80px;
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #1A2639;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="logo-placeholder">RIPODOC</div>
        <div class="header-serif">RipoDoc for Managed<br>Service Providers</div>
        <div class="decorative-line"></div>
        <div class="subtitle-sans">Transform Standard Client Reports into Clickable, Verifiable Evidence Layers Without Changing Your Stack</div>
        <div class="accent-block"></div>
    </div>
</body>
</html>
