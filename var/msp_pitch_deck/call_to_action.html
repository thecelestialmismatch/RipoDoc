<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+Pro:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            box-sizing: border-box;
            background: #FFFFFF;
            font-family: 'Source Sans Pro', sans-serif;
            color: #3E4A61;
            position: relative;
            overflow: hidden;
        }
        .accent-bg {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 600px;
            height: 600px;
            background: #C24D2C;
            opacity: 0.1;
            z-index: 0;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 720px;
            text-align: center;
            z-index: 2;
            position: relative;
        }
        .header-serif {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #1A2639;
            font-size: 72px;
            margin-bottom: 40px;
            line-height: 1.1;
        }
        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 60px;
        }
        .cta-button {
            background: #1A2639;
            color: #FFFFFF;
            padding: 16px 32px;
            font-weight: 400;
            font-size: 20px;
            text-decoration: none;
            border: 2px solid #1A2639;
            display: inline-block;
            min-width: 400px;
        }
        .cta-button:hover {
            background: #C24D2C;
            border-color: #C24D2C;
        }
        .cta-button i {
            margin-right: 12px;
        }
        .tagline {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 48px;
            color: #C24D2C;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-bg"></div>
        <div class="content">
            <div class="header-serif">Secure Your Client Relationships Today</div>
            <div class="cta-container">
                <a href="https://www.ripodoc.com" class="cta-button"><i class="fas fa-globe"></i>Visit www.ripodoc.com</a>
                <a href="https://github.com/thecelestialmismatch/RipoDoc" class="cta-button"><i class="fas fa-code-branch"></i>Explore on GitHub</a>
                <a href="https://www.ripodoc.com" class="cta-button"><i class="fas fa-calendar-alt"></i>Schedule a Demo</a>
                <a href="https://www.ripodoc.com" class="cta-button"><i class="fas fa-download"></i>Download the Tool</a>
            </div>
            <div class="tagline">Send a normal PDF.<br>Every number is clickable.</div>
        </div>
    </div>
</body>
</html>
