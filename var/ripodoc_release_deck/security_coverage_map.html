<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; }
      .slide-container {
        width: 1280px;
        min-height: 720px;
        box-sizing: border-box;
        background: #020617;
        color: #f8fafc;
        font-family: 'Inter', -apple-system, sans-serif;
        padding-top: 60px;
      }
      .header {
        padding: 0 80px;
        margin-bottom: 40px;
      }
      .header h2 {
        font-size: 48px;
        font-weight: 800;
        color: #22d3ee;
      }
      .main-content {
        padding: 0 80px;
        display: flex;
        gap: 40px;
        align-items: flex-start;
      }
      .chart-wrapper {
        flex: 1.5;
        background: #0f172a;
        border: 1px solid #1e293b;
        padding: 30px;
        border-radius: 4px;
      }
      .legend-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .stat-card {
        background: #0f172a;
        border: 1px solid #1e293b;
        padding: 20px;
        border-radius: 4px;
      }
      .stat-value {
        font-size: 32px;
        font-weight: 800;
        color: #22d3ee;
      }
      .stat-label {
        font-size: 14px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-top: 4px;
      }
      .coverage-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        color: #cbd5e1;
      }
      .coverage-table th {
        text-align: left;
        padding: 10px;
        border-bottom: 1px solid #1e293b;
        color: #94a3b8;
      }
      .coverage-table td {
        padding: 10px;
        border-bottom: 1px solid #1e293b;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h2>Security Coverage Map</h2>
        </div>
        <div class="main-content">
            <div class="chart-wrapper">
                <div style="height: 400px;">
                    <canvas id="coverageChart"></canvas>
                </div>
            </div>
            <div class="legend-wrapper">
                <div class="stat-card">
                    <div class="stat-value">133</div>
                    <div class="stat-label">Total Verified Claims</div>
                </div>
                <table class="coverage-table">
                    <thead>
                        <tr>
                            <th>Security Domain</th>
                            <th style="text-align: right;">Tests</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>PDF Serialization & Safety</td><td style="text-align: right;">45</td></tr>
                        <tr><td>Input Validation & Schemas</td><td style="text-align: right;">29</td></tr>
                        <tr><td>Runtime Posture & Indicators</td><td style="text-align: right;">26</td></tr>
                        <tr><td>Evidence Authorization</td><td style="text-align: right;">16</td></tr>
                        <tr><td>Audit Integrity Chain</td><td style="text-align: right;">11</td></tr>
                        <tr><td>Identity & Access Control</td><td style="text-align: right;">5</td></tr>
                        <tr><td>Worker Boundary (E2E)</td><td style="text-align: right;">1</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('coverageChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['PDF Safety', 'Validation', 'Posture', 'Evidence', 'Audit', 'Identity', 'Worker'],
                datasets: [{
                    label: 'Number of Tests',
                    data: [45, 29, 26, 16, 11, 5, 1],
                    backgroundColor: 'rgba(34, 211, 238, 0.6)',
                    borderColor: '#22d3ee',
                    borderWidth: 1
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        grid: { color: '#1e293b' },
                        ticks: { color: '#94a3b8' }
                    },
                    y: {
                        grid: { display: false },
                        ticks: { color: '#f8fafc', font: { weight: 'bold' } }
                    }
                }
            }
        });
    </script>
</body>
</html>
