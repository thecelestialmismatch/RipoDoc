# Standalone RipoDoc CRM sales-operations runtime for RipoDoc.
# Do not merge this Compose project into RipoDoc's application Compose file or networks.
# Terminate TLS on a separately managed reverse proxy that forwards only to 127.0.0.1:${CRM_BIND_PORT}.

name: ripodoc-crm

services:
  database:
    image: ${MARIADB_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_DATABASE: ${CRM_DATABASE_NAME}
      MARIADB_USER: ${CRM_DATABASE_USER}
      MARIADB_PASSWORD: ${CRM_DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${CRM_DATABASE_ROOT_PASSWORD}
    command: ['--skip-name-resolve']
    volumes:
      - crm-db:/var/lib/mysql
    networks:
      - crm-internal
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  crm:
    image: ${CRM_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      CRM_DATABASE_HOST: database
      CRM_DATABASE_NAME: ${CRM_DATABASE_NAME}
      CRM_DATABASE_USER: ${CRM_DATABASE_USER}
      CRM_DATABASE_PASSWORD: ${CRM_DATABASE_PASSWORD}
      CRM_ADMIN_USERNAME: ${CRM_ADMIN_USERNAME}
      CRM_ADMIN_PASSWORD: ${CRM_ADMIN_PASSWORD}
      CRM_SITE_URL: ${CRM_SITE_URL}
    volumes:
      - crm-data:/var/www/html/data
      - crm-custom:/var/www/html/custom
      - crm-custom-client:/var/www/html/client/custom
    ports:
      - '127.0.0.1:${CRM_BIND_PORT}:80'
    networks:
      - crm-internal
      - crm-edge
    depends_on:
      database:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'bin/command', 'app-check']
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 40s

  daemon:
    image: ${CRM_IMAGE}
    restart: unless-stopped
    env_file: .env
    volumes:
      - crm-data:/var/www/html/data
      - crm-custom:/var/www/html/custom
      - crm-custom-client:/var/www/html/client/custom
    entrypoint: docker-daemon.sh
    networks:
      - crm-internal
    depends_on:
      crm:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'bin/command', 'app-check']
      interval: 180s
      timeout: 20s
      retries: 5
      start_period: 60s

networks:
  crm-internal:
    internal: true
  crm-edge:

volumes:
  crm-db:
  crm-data:
  crm-custom:
  crm-custom-client:
