# Standalone EspoCRM sales-operations runtime for RipoDoc.
# Do not merge this Compose project into RipoDoc's application Compose file or networks.
# Terminate TLS on a separately managed reverse proxy that forwards only to 127.0.0.1:${ESPOCRM_BIND_PORT}.

name: ripodoc-crm

services:
  database:
    image: ${MARIADB_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_DATABASE: ${ESPOCRM_DATABASE_NAME}
      MARIADB_USER: ${ESPOCRM_DATABASE_USER}
      MARIADB_PASSWORD: ${ESPOCRM_DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${ESPOCRM_DATABASE_ROOT_PASSWORD}
    command: ['--skip-name-resolve']
    volumes:
      - espocrm-db:/var/lib/mysql
    networks:
      - crm-internal
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  espocrm:
    image: ${ESPOCRM_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      ESPOCRM_DATABASE_HOST: database
      ESPOCRM_DATABASE_NAME: ${ESPOCRM_DATABASE_NAME}
      ESPOCRM_DATABASE_USER: ${ESPOCRM_DATABASE_USER}
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DATABASE_PASSWORD}
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD}
      ESPOCRM_SITE_URL: ${ESPOCRM_SITE_URL}
    volumes:
      - espocrm-data:/var/www/html/data
      - espocrm-custom:/var/www/html/custom
      - espocrm-custom-client:/var/www/html/client/custom
    ports:
      - '127.0.0.1:${ESPOCRM_BIND_PORT}:80'
    networks:
      - crm-internal
      - crm-edge
    depends_on:
      database:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'bin/command', 'app-check']
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 40s

  daemon:
    image: ${ESPOCRM_IMAGE}
    restart: unless-stopped
    env_file: .env
    volumes:
      - espocrm-data:/var/www/html/data
      - espocrm-custom:/var/www/html/custom
      - espocrm-custom-client:/var/www/html/client/custom
    entrypoint: docker-daemon.sh
    networks:
      - crm-internal
    depends_on:
      espocrm:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'bin/command', 'app-check']
      interval: 180s
      timeout: 20s
      retries: 5
      start_period: 60s

networks:
  crm-internal:
    internal: true
  crm-edge:

volumes:
  espocrm-db:
  espocrm-data:
  espocrm-custom:
  espocrm-custom-client:
